name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag at this revision to publish (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the release tag matches the APK version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          version = re.search(r"^version:\s*(\d+)\.(\d+)\.(\d+)\+(\d+)\s*$",
                              Path("app/pubspec.yaml").read_text(), re.MULTILINE)
          if version is None:
              raise SystemExit("Expected a stable app version (major.minor.patch+code) in app/pubspec.yaml.")
          major, minor, patch, code = map(int, version.groups())
          if not (1 <= major <= 2099 and minor <= 999 and patch <= 999 and
                  code == major * 1_000_000 + minor * 1_000 + patch):
              raise SystemExit("APK build number must be major*1000000 + minor*1000 + patch.")
          tag = os.environ["RELEASE_TAG"]
          if tag and tag != f"v{major}.{minor}.{patch}":
              raise SystemExit(f"Expected release tag v{major}.{minor}.{patch}, got {tag!r}.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"tag={tag}", file=output)
              print(f"name={major}.{minor}.{patch}", file=output)
              print(f"code={code}", file=output)
          PY
          if [[ -n "$RELEASE_TAG" ]]; then
            refs=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
            commit=$(awk 'END { print $1 }' <<< "$refs")
            test "$commit" = "$(git rev-parse HEAD)" || {
              echo "Release tag must already point to the revision being built." >&2
              exit 1
            }
          fi

  checks:
    uses: ./.github/workflows/ci.yml
    with:
      skip_android_native: true

  build-linux:
    needs: [version, build-android-native]
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            bundle_name: devicebridge-linux-x86_64
          - arch: arm64
            os: ubuntu-24.04-arm
            bundle_name: devicebridge-linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      DEVICEBRIDGE_BUILD_TARGET: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: spikes/tsnet/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            spikes/tsnet/go.sum
            spikes/wireguard/go.sum

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xxhash

      - name: Set up Flutter (x64)
        if: matrix.arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Cache Flutter SDK (arm64)
        if: matrix.arch == 'arm64'
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-3.50.0-linux-arm64

      - name: Set up Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          if [ ! -x "$HOME/flutter/bin/flutter" ]; then
            git clone https://github.com/flutter/flutter.git --branch 3.50.0 --depth 1 "$HOME/flutter"
          fi
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" precache --linux

      - name: Build Go binaries and Syncthing engine
        run: |
          mkdir -p artifacts/linux
          go build -trimpath -ldflags='-s -w' -o artifacts/linux/bridge-agent ./cmd/bridge-agent
          go build -trimpath -ldflags='-s -w' -o artifacts/linux/bridge-cli ./cmd/bridge-cli
          bash scripts/build_syncthing.sh
          bash scripts/build_tsnet.sh
          bash scripts/build_wg.sh
          bash scripts/prepare_bundled_bins.sh

      - name: Download Termux SSH bootstrap assets for Linux
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-android-arm64
          path: app/assets/bin

      - name: Compile Flutter Linux release bundle
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package Linux release archives
        run: |
          mkdir -p dist
          bundle_dir="$(find app/build/linux -maxdepth 3 -type d -name bundle | head -n 1)"
          test -d "$bundle_dir"
          stage_dir="$(mktemp -d)"
          cp -a "$bundle_dir" "$stage_dir/devicebridge"
          cp docs/THIRD_PARTY_NOTICES.md "$stage_dir/devicebridge/THIRD_PARTY_NOTICES.md"
          cp -a docs/licenses "$stage_dir/devicebridge/licenses"
          mkdir -p "$stage_dir/devicebridge/tools"
          cp scripts/devicebridge_ssh.py "$stage_dir/devicebridge/tools/devicebridge_ssh.py"
          python3 - <<'PY' > "$stage_dir/devicebridge/THIRD_PARTY_NOTICES-GO.txt"
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from go_notices import collect
          bins = [
              Path("artifacts/linux/bridge-agent"),
              Path("artifacts/linux/bridge-cli"),
              Path("artifacts/linux/bridge-sync"),
              Path("artifacts/linux/bridge-tailnet"),
              Path("artifacts/linux/bridge-wg"),
          ]
          print(collect(bins), end="")
          PY
          tar -C "$stage_dir" -czf "dist/${{ matrix.bundle_name }}.tar.gz" devicebridge

          cli_stage="$(mktemp -d)"
          cli_name="devicebridge-cli-linux-${{ matrix.arch }}"
          mkdir -p "$cli_stage/$cli_name"
          cp artifacts/linux/bridge-* "$cli_stage/$cli_name/"
          cp "$stage_dir/devicebridge/THIRD_PARTY_NOTICES-GO.txt" "$cli_stage/$cli_name/"
          cp docs/THIRD_PARTY_NOTICES.md "$cli_stage/$cli_name/"
          cp -a docs/licenses "$cli_stage/$cli_name/licenses"
          tar -C "$cli_stage" -czf "dist/${cli_name}.tar.gz" "$cli_name"

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Stage and upload Linux x86_64 SSH bootstrap assets
        if: matrix.arch == 'amd64'
        run: |
          mkdir -p overlay-linux/app/assets/bin
          cp app/assets/bin/linux-x86_64-*.gzbin overlay-linux/app/assets/bin/

      - name: Upload Linux x86_64 SSH bootstrap assets
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: overlay-linux-x86_64
          path: overlay-linux
          if-no-files-found: error
          compression-level: 0

  build-android-native:
    needs: version
    name: Android Native (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm, amd64]
    runs-on: ubuntu-latest
    env:
      DEVICEBRIDGE_BUILD_TARGET: android
      DEVICEBRIDGE_ANDROID_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: spikes/tsnet/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            spikes/tsnet/go.sum
            spikes/wireguard/go.sum

      - name: Install xxhash
        run: sudo apt-get update && sudo apt-get install -y xxhash

      - name: Install Android NDK 28.2.13676358
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          sdkm="$(find "$sdk_root/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$sdkm"
          yes | "$sdkm" --licenses >/dev/null || true
          "$sdkm" "ndk;28.2.13676358"

      - name: Build Android core, Syncthing, Tailnet, and WireGuard
        run: |
          bash scripts/build_android_core.sh
          bash scripts/build_syncthing.sh
          bash scripts/build_tsnet.sh
          bash scripts/build_wg.sh

      - name: Package standalone Android/Termux core tarball and APK overlay
        run: |
          mkdir -p dist overlay/app/android/app/src/main/jniLibs
          cp -a app/android/app/src/main/jniLibs/* overlay/app/android/app/src/main/jniLibs/

          pkg_name="devicebridge-android-${{ matrix.arch }}-core"
          stage="$(mktemp -d)"
          mkdir -p "$stage/$pkg_name"
          cp "artifacts/android-${{ matrix.arch }}"/*.so "$stage/$pkg_name/"
          for role in cli agent sync tailnet wg; do
            ln "$stage/$pkg_name/libbridge_$role.so" "$stage/$pkg_name/bridge-$role"
          done
          cp docs/THIRD_PARTY_NOTICES.md "$stage/$pkg_name/"
          cp -a docs/licenses "$stage/$pkg_name/licenses"
          python3 - "artifacts/android-${{ matrix.arch }}" <<'PY' > "$stage/$pkg_name/THIRD_PARTY_NOTICES-GO.txt"
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from go_notices import collect
          print(collect(sorted(Path(sys.argv[1]).glob("libbridge_*.so"))), end="")
          PY
          notices=overlay/app/android/app/src/main/assets/devicebridge-notices
          mkdir -p "$notices"
          cp "$stage/$pkg_name/THIRD_PARTY_NOTICES-GO.txt" "$notices/GO-${{ matrix.arch }}.txt"
          tar -C "$stage" -czf "dist/${pkg_name}.tar.gz" "$pkg_name"

      - name: Upload ARM64 Termux SSH bootstrap assets
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-android-arm64
          path: |
            app/assets/bin/android-arm64-libbridge_agent.gzbin
            app/assets/bin/android-arm64-libbridge_cli.gzbin
            app/assets/bin/android-arm64-libbridge_sync.gzbin
          if-no-files-found: error
          compression-level: 0

      - name: Upload APK native overlay
        uses: actions/upload-artifact@v4
        with:
          name: overlay-android-${{ matrix.arch }}
          path: overlay
          if-no-files-found: error

      - name: Upload standalone Android/Termux core tarball
        uses: actions/upload-artifact@v4
        with:
          name: dist-android-core-${{ matrix.arch }}
          path: dist/devicebridge-android-${{ matrix.arch }}-core.tar.gz
          if-no-files-found: error
          compression-level: 0

  build-android-apk:
    name: Android APKs (all ABIs + universal)
    needs: [version, build-android-native, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          sdkm="$(find "$sdk_root/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$sdkm"
          yes | "$sdkm" --licenses >/dev/null || true
          "$sdkm" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Download native JNI libraries and bundled assets
        uses: actions/download-artifact@v4
        with:
          pattern: overlay-*
          merge-multiple: true
          path: .

      - name: Include native dependency notices
        run: |
          cp docs/licenses/{syncthing-v2.1.7,shizuku-api-v13.1.5}.txt app/android/app/src/main/assets/devicebridge-notices/

      - name: Configure persistent Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "Missing $secret; release signing is required." >&2
              exit 1
            fi
          done
          ks_path="${{ runner.temp }}/release-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks_path"
          chmod 600 "$ks_path"
          echo "ANDROID_KEYSTORE_PATH=$ks_path" >> "$GITHUB_ENV"

      - name: Build ARM64 release APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Let Flutter regenerate the plugin registrant in release mode.
          flutter build apk --release --split-per-abi --target-platform android-arm64
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/devicebridge-android-arm64-v8a.apk

      - name: Download ARM64 SSH assets for other Android devices
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-android-arm64
          path: app/assets/bin

      - name: Build the remaining split APKs and the universal APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-x64
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../dist/devicebridge-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ../dist/devicebridge-android-x86_64.apk
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/devicebridge-android-universal.apk

      - name: Verify APK contents, version, and signer
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          python3 scripts/verify_release_apks.py dist "$VERSION_NAME" "$VERSION_CODE" "$ANDROID_SDK_ROOT/build-tools/36.0.0"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-android-apks
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish Release & Checksums
    needs: [version, checks, build-linux, build-android-native, build-android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.version.outputs.tag || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install xxhash
        run: sudo apt-get update && sudo apt-get install -y xxhash

      - name: Download all release archives and APKs
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: release-assets

      - name: Generate XXH64 checksums and release notes
        run: |
          cd release-assets
          python3 - <<'PY' > ../RELEASE_NOTES.md
          from pathlib import Path
          import subprocess

          expected = {"devicebridge-linux-x86_64.tar.gz", "devicebridge-linux-arm64.tar.gz"}
          expected.update(f"devicebridge-cli-linux-{arch}.tar.gz" for arch in ("amd64", "arm64"))
          expected.update(f"devicebridge-android-{arch}-core.tar.gz" for arch in ("amd64", "arm64", "arm"))
          expected.update(f"devicebridge-android-{abi}.apk" for abi in ("arm64-v8a", "armeabi-v7a", "x86_64", "universal"))
          actual = {path.name for path in Path(".").iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"Unexpected release inventory, missing {sorted(expected - actual)}, extra {sorted(actual - expected)}")
          files = [Path(name) for name in sorted(expected)]
          for artifact in files:
              if not 0 < artifact.stat().st_size < 2**31:
                  raise SystemExit(f"Missing data or GitHub size limit exceeded: {artifact}")
          with open("CHECKSUMS.xxh64", "w") as checksums:
              subprocess.run(["xxhsum", "-H1", *files], stdout=checksums, check=True)
          print("## DeviceBridge Release Artifacts\n")
          print("All binaries are built in parallel across Linux (`amd64`, `arm64`) and Android (`arm64-v8a`, `armeabi-v7a`, `x86_64`).")
          print("File integrity is verified with **XXH64** (`xxhsum -H1`).\n")
          print("> **Signing:** Release APKs are signed with DeviceBridge's persistent release key for seamless in-place upgrades across releases.\n")
          print("| Artifact | Size | XXH64 (`xxhsum -H1`) |")
          print("| --- | ---: | --- |")
          for p in files:
              size_mib = p.stat().st_size / (1024 * 1024)
              xxh = subprocess.check_output(["xxhsum", "-H1", p.name], text=True).split()[0]
              print(f"| `{p.name}` | {size_mib:.2f} MiB | `{xxh}` |")
          print("\n### Verify Checksums\n")
          print("```bash")
          print("xxhsum -H1 --check CHECKSUMS.xxh64")
          print("```")
          PY

      - name: Upload bundled release assets artifact
        if: needs.version.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-all
          path: |
            release-assets/*
            RELEASE_NOTES.md
          if-no-files-found: error
          compression-level: 0

      - name: Upload assets to a draft and publish the complete release
        if: needs.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if [[ "$(jq -r .isDraft release.json)" != "true" ]]; then
              echo "$RELEASE_TAG is already published." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "DeviceBridge $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release view "$RELEASE_TAG" --json assets > release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          assets = json.loads(Path("release.json").read_text())["assets"]
          remote = {a["name"]: a["size"] for a in assets if a["state"] == "uploaded"}
          local = {p.name: p.stat().st_size for p in Path("release-assets").iterdir()}
          if local != remote or len(assets) != len(local):
              raise SystemExit(f"Draft release assets did not match staged files: {remote}")
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
